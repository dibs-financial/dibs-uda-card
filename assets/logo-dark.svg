<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="UDA mark: a U with three lashes, like a closed eye">
  <title>UDA</title>
  <g fill="none" stroke="#f0f0f0" stroke-linecap="round" stroke-linejoin="round">
    <!-- the U / closed lid -->
    <path d="M50 55 V100 A50 50 0 0 0 150 100 V55" stroke-width="18"/>
    <!-- lashes: two at 45 degrees, one straight down -->
    <line x1="56.2" y1="143.8" x2="39.9" y2="160.1" stroke-width="14"/>
    <line x1="143.8" y1="143.8" x2="160.1" y2="160.1" stroke-width="14"/>
    <line x1="100" y1="162" x2="100" y2="185" stroke-width="14"/>
  </g>
</svg>
